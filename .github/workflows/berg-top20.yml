name: BERG Top20 Wall Art Benchmark

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install BERG runtime
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy pyyaml scikit-learn h5py tqdm Pillow torchextractor awscli requests beautifulsoup4 tabulate
          git clone -q https://github.com/gifale95/BERG.git /tmp/BERG
          pip install --no-deps -e /tmp/BERG

      - name: Download THINGS-fMRI ViT-B/32 Subject-1 weights
        run: |
          mkdir -p berg_dir/encoding_models/modality-fmri/train_dataset-things_fmri_1/model-vit_b_32
          aws s3 cp --no-sign-request --recursive \
            --exclude "*" --include "*sub-01.npy" \
            s3://brain-encoding-response-generator/encoding_models/modality-fmri/train_dataset-things_fmri_1/model-vit_b_32 \
            berg_dir/encoding_models/modality-fmri/train_dataset-things_fmri_1/model-vit_b_32

      - name: Collect live top sellers and run BERG
        run: |
          cat > /tmp/benchmark.py <<'PY'
          import os, io, re, json, math, gc
          import requests
          import numpy as np
          import pandas as pd
          from PIL import Image, ImageOps, ImageDraw
          from scipy.stats import spearmanr
          from berg import BERG

          BASE = "https://aureous.co"
          COLLECTION_JSON = BASE + "/collections/best-sellers/products.json?limit=80&sort_by=best-selling"
          MODEL_ID = "fmri-things_fmri_1-vit_b_32"
          ROIS = ["V1", "V2", "V3", "hV4", "IT"]
          R_THRESHOLD = 0.10
          TARGET_N = 20
          HEADERS = {"User-Agent": "Mozilla/5.0 (BERG benchmark; research)"}
          OUT = "out"
          os.makedirs(OUT, exist_ok=True)
          os.makedirs(f"{OUT}/images", exist_ok=True)

          def get_collection_products():
              r = requests.get(COLLECTION_JSON, headers=HEADERS, timeout=30)
              print("COLLECTION_JSON_STATUS", r.status_code, r.url)
              if r.ok:
                  data = r.json()
                  products = data.get("products", [])
                  if products:
                      return products
              raise RuntimeError("Could not read Shopify best-sellers products JSON")

          def image_url_from_product(p):
              imgs = p.get("images") or []
              if not imgs:
                  return None
              first = imgs[0]
              if isinstance(first, dict):
                  return first.get("src") or first.get("url")
              return first

          def ahash(img, size=8):
              g = img.convert("L").resize((size, size), Image.Resampling.LANCZOS)
              a = np.asarray(g, dtype=float)
              return a > a.mean()

          def hamming(a, b):
              return int(np.count_nonzero(a != b))

          def safe_name(s):
              s = re.sub(r"[^A-Za-z0-9_-]+", "_", s.strip())
              return s[:70].strip("_") or "item"

          def pad_square(img, size=512):
              a = np.asarray(img.convert("RGB"))
              h, w = a.shape[:2]
              k1 = max(1, h // 50)
              k2 = max(1, w // 50)
              border = np.concatenate([
                  a[:k1].reshape(-1, 3), a[-k1:].reshape(-1, 3),
                  a[:, :k2].reshape(-1, 3), a[:, -k2:].reshape(-1, 3)
              ], axis=0)
              fill = tuple(np.median(border, axis=0).astype(np.uint8).tolist())
              contained = ImageOps.contain(img.convert("RGB"), (size, size), Image.Resampling.LANCZOS)
              canvas = Image.new("RGB", (size, size), fill)
              xy = ((size-contained.width)//2, (size-contained.height)//2)
              canvas.paste(contained, xy)
              return canvas, fill

          def image_features(img):
              x = np.asarray(img.resize((256,256)).convert("RGB"), dtype=np.float32) / 255.0
              gray = 0.299*x[...,0] + 0.587*x[...,1] + 0.114*x[...,2]
              mx = x.max(axis=-1); mn = x.min(axis=-1)
              sat = np.where(mx > 1e-6, (mx-mn)/mx, 0)
              brightness = float(gray.mean())
              contrast = float(gray.std())
              saturation = float(sat.mean())
              whitespace = float((gray > 0.88).mean())
              darkspace = float((gray < 0.18).mean())
              gx = np.abs(np.diff(gray, axis=1)).mean()
              gy = np.abs(np.diff(gray, axis=0)).mean()
              edge_density = float((gx + gy) / 2.0)
              # Colorfulness (Hasler-Susstrunk style)
              rg = x[...,0] - x[...,1]
              yb = 0.5*(x[...,0] + x[...,1]) - x[...,2]
              colorfulness = float(np.sqrt(rg.std()**2 + yb.std()**2) + 0.3*np.sqrt(rg.mean()**2 + yb.mean()**2))
              # Center-vs-border luminance contrast
              c = gray[64:192,64:192].mean()
              border = np.concatenate([gray[:32].ravel(), gray[-32:].ravel(), gray[:, :32].ravel(), gray[:, -32:].ravel()])
              center_contrast = float(abs(c - border.mean()))
              # Approx left-right luminance symmetry (lower MAE = more symmetric); return 1-MAE
              left = gray[:, :128]
              right = np.fliplr(gray[:, 128:])
              symmetry = float(1.0 - np.abs(left-right).mean())
              return dict(
                  brightness=brightness, contrast=contrast, saturation=saturation,
                  whitespace=whitespace, darkspace=darkspace, edge_density=edge_density,
                  colorfulness=colorfulness, center_contrast=center_contrast, symmetry=symmetry
              )

          products = get_collection_products()
          print("PRODUCTS_FETCHED", len(products))

          chosen = []
          hashes = []
          for source_rank, p in enumerate(products, start=1):
              if len(chosen) >= TARGET_N:
                  break
              u = image_url_from_product(p)
              if not u:
                  continue
              if u.startswith("//"):
                  u = "https:" + u
              try:
                  r = requests.get(u, headers=HEADERS, timeout=30)
                  r.raise_for_status()
                  img = Image.open(io.BytesIO(r.content)).convert("RGB")
              except Exception as e:
                  print("IMAGE_FAIL", source_rank, p.get("title"), repr(e))
                  continue
              h = ahash(img)
              # Avoid near-identical duplicated listing variants.
              if any(hamming(h, prev) <= 3 for prev in hashes):
                  print("SKIP_NEAR_DUP", source_rank, p.get("title"))
                  continue
              hashes.append(h)
              item_rank = len(chosen) + 1
              sq, fill = pad_square(img, 512)
              fn = f"{item_rank:02d}_{safe_name(p.get('title','untitled'))}.jpg"
              sq.save(f"{OUT}/images/{fn}", quality=94)
              rec = {
                  "rank": item_rank,
                  "source_rank": source_rank,
                  "title": p.get("title"),
                  "handle": p.get("handle"),
                  "product_url": BASE + "/products/" + str(p.get("handle")),
                  "image_url": u,
                  "fill_rgb": str(fill),
                  "filename": fn,
              }
              rec.update(image_features(sq))
              chosen.append((rec, sq))
              print("CHOSEN", json.dumps({k:rec[k] for k in ["rank","source_rank","title","product_url","image_url"]}, ensure_ascii=False))

          if len(chosen) < TARGET_N:
              raise RuntimeError(f"Only collected {len(chosen)} unique images")

          meta = pd.DataFrame([r for r,_ in chosen])
          meta.to_csv(f"{OUT}/selected_products.csv", index=False)

          # contact sheet
          thumb_w, thumb_h = 260, 300
          sheet = Image.new("RGB", (thumb_w*4, thumb_h*5), "white")
          draw = ImageDraw.Draw(sheet)
          for i, (rec, img) in enumerate(chosen):
              t = ImageOps.contain(img, (240,240), Image.Resampling.LANCZOS)
              x = (i%4)*thumb_w + 10
              y = (i//4)*thumb_h + 10
              sheet.paste(t, (x + (240-t.width)//2, y))
              label = f"#{rec['rank']} {rec['title'][:29]}"
              draw.text((x, 255 + (i//4)*thumb_h), label, fill="black")
          sheet.save(f"{OUT}/contact_sheet.jpg", quality=92)

          stimulus = np.stack([
              np.asarray(img, dtype=np.uint8).transpose(2,0,1) for _,img in chosen
          ], axis=0)
          print("STIMULUS", stimulus.shape, stimulus.dtype, stimulus.min(), stimulus.max())

          berg = BERG(berg_dir=os.path.abspath("berg_dir"))
          model = berg.get_encoding_model(
              MODEL_ID, subject=1, device="cpu", selection={"roi": ROIS}
          )
          responses = berg.encode(model, stimulus, show_progress=True)
          md = model.metadata
          if "correlation_results" in md:
              corr = np.asarray(md["correlation_results"])
          elif "encoding_model" in md and "correlation_results" in md["encoding_model"]:
              corr = np.asarray(md["encoding_model"]["correlation_results"])
          else:
              raise KeyError(f"correlation_results missing; metadata keys={list(md.keys())}")

          out_rows = []
          offset = 0
          for roi in ROIS:
              idx = np.asarray(md["roi"][roi], dtype=int)
              n_total = len(idx)
              block = responses[:, offset:offset+n_total]
              offset += n_total
              reliable = corr[idx] >= R_THRESHOLD
              print("RELIABLE", roi, int(reliable.sum()), "/", n_total)
              for i, (rec, _) in enumerate(chosen):
                  x = np.asarray(block[i][reliable], dtype=float)
                  pos = x[x > 0]
                  n_top = max(1, int(np.ceil(len(pos)*0.10))) if len(pos) else 0
                  top10 = float(np.sort(pos)[-n_top:].mean()) if n_top else float("nan")
                  out_rows.append({
                      "rank": rec["rank"], "title": rec["title"], "roi": roi,
                      "mean": float(x.mean()), "mean_abs": float(np.abs(x).mean()),
                      "positive_ratio": float((x > 0).mean()),
                      "p90": float(np.percentile(x,90)),
                      "max": float(x.max()),
                      "top10_positive": top10,
                      "reliable_voxels": int(reliable.sum())
                  })

          raw = pd.DataFrame(out_rows)
          raw.to_csv(f"{OUT}/berg_roi_results.csv", index=False)

          # Image-level BERG features
          pivs = {}
          for metric in ["mean","mean_abs","positive_ratio","top10_positive"]:
              pv = raw.pivot(index="rank", columns="roi", values=metric)
              pv.columns = [f"{metric}_{c}" for c in pv.columns]
              pivs[metric] = pv
          merged = meta.set_index("rank")
          for pv in pivs.values():
              merged = merged.join(pv)

          merged["berg_mean_response"] = merged[[f"mean_{r}" for r in ROIS]].mean(axis=1)
          merged["berg_positive_ratio"] = merged[[f"positive_ratio_{r}" for r in ROIS]].mean(axis=1)
          merged["berg_top10_positive"] = merged[[f"top10_positive_{r}" for r in ROIS]].mean(axis=1)
          merged["berg_early_positive"] = merged[[f"positive_ratio_{r}" for r in ["V1","V2","V3"]]].mean(axis=1)
          merged["berg_ventral_positive"] = merged[[f"positive_ratio_{r}" for r in ["hV4","IT"]]].mean(axis=1)
          merged["berg_ventral_top10"] = merged[[f"top10_positive_{r}" for r in ["hV4","IT"]]].mean(axis=1)
          merged.reset_index(inplace=True)

          # Rank correlation: positive rho_vs_sales means larger value tends to occur at better ranks.
          candidates = [
              "berg_mean_response","berg_positive_ratio","berg_top10_positive",
              "berg_early_positive","berg_ventral_positive","berg_ventral_top10",
              "brightness","contrast","saturation","whitespace","darkspace",
              "edge_density","colorfulness","center_contrast","symmetry"
          ]
          cors = []
          sales_score = -merged["rank"].to_numpy(dtype=float)
          for col in candidates:
              rho, p = spearmanr(merged[col].to_numpy(dtype=float), sales_score)
              cors.append({"metric": col, "spearman_vs_better_rank": float(rho), "p_value": float(p)})
          corr_df = pd.DataFrame(cors).sort_values("spearman_vs_better_rank", ascending=False)
          corr_df.to_csv(f"{OUT}/rank_correlations.csv", index=False)

          # Top 5 vs ranks 16-20 effect sizes (simple differences, no causal claim).
          top5 = merged.nsmallest(5, "rank")
          bottom5 = merged.nlargest(5, "rank")
          diffs=[]
          for col in candidates:
              a=float(top5[col].mean()); b=float(bottom5[col].mean())
              pooled=float(merged[col].std(ddof=1))
              diffs.append({"metric":col,"top5_mean":a,"rank16_20_mean":b,
                            "difference":a-b,"difference_in_sample_sd":(a-b)/pooled if pooled>0 else float("nan")})
          diff_df=pd.DataFrame(diffs).sort_values("difference_in_sample_sd",ascending=False)
          diff_df.to_csv(f"{OUT}/top5_vs_bottom5.csv",index=False)

          # Data-driven composite: z-score only metrics whose observed rank correlation is positive.
          # This is exploratory and is NOT treated as a validated sales score.
          use = [c for c in ["berg_positive_ratio","berg_mean_response","berg_ventral_positive","berg_top10_positive"]
                 if float(corr_df.loc[corr_df.metric==c,"spearman_vs_better_rank"].iloc[0]) > 0]
          if use:
              z=[]
              for c in use:
                  s=merged[c].astype(float)
                  z.append((s-s.mean())/(s.std(ddof=0)+1e-9))
              merged["exploratory_berg_composite"] = np.vstack(z).mean(axis=0)
          else:
              merged["exploratory_berg_composite"] = np.nan
          merged.to_csv(f"{OUT}/benchmark_20.csv", index=False)

          print("\n=== SELECTED 20 ===")
          print(meta[["rank","source_rank","title","product_url"]].to_string(index=False))
          print("\n=== BERG SUMMARY BY PRODUCT ===")
          print(merged[["rank","title","berg_mean_response","berg_positive_ratio","berg_top10_positive","berg_ventral_positive","berg_ventral_top10","contrast","saturation","whitespace","edge_density","exploratory_berg_composite"]].round(4).to_string(index=False))
          print("\n=== RANK CORRELATIONS ===")
          print(corr_df.round(4).to_string(index=False))
          print("\n=== TOP5 VS RANK16-20 ===")
          print(diff_df.round(4).to_string(index=False))

          # Distribution summary
          summary = {
              "n": int(len(merged)),
              "collection_url": COLLECTION_JSON,
              "subject": 1,
              "r_threshold": R_THRESHOLD,
              "reliable_voxels": {r:int((corr[np.asarray(md['roi'][r],dtype=int)]>=R_THRESHOLD).sum()) for r in ROIS},
              "berg_positive_ratio_mean": float(merged["berg_positive_ratio"].mean()),
              "berg_positive_ratio_p25": float(merged["berg_positive_ratio"].quantile(.25)),
              "berg_positive_ratio_median": float(merged["berg_positive_ratio"].median()),
              "berg_positive_ratio_p75": float(merged["berg_positive_ratio"].quantile(.75)),
              "berg_top10_mean": float(merged["berg_top10_positive"].mean()),
              "berg_top10_median": float(merged["berg_top10_positive"].median()),
              "berg_mean_response_mean": float(merged["berg_mean_response"].mean()),
              "best_positive_rank_correlations": corr_df.head(6).to_dict(orient="records"),
              "top_products_by_positive_ratio": merged.nlargest(5,"berg_positive_ratio")[["rank","title","berg_positive_ratio"]].to_dict(orient="records"),
              "top_products_by_ventral_positive": merged.nlargest(5,"berg_ventral_positive")[["rank","title","berg_ventral_positive"]].to_dict(orient="records"),
              "top_products_by_top10": merged.nlargest(5,"berg_top10_positive")[["rank","title","berg_top10_positive"]].to_dict(orient="records")
          }
          with open(f"{OUT}/summary.json","w") as f:
              json.dump(summary,f,indent=2,ensure_ascii=False)
          print("\n=== SUMMARY JSON ===")
          print(json.dumps(summary,indent=2,ensure_ascii=False))

          if hasattr(model, "cleanup"):
              model.cleanup()
          PY
          python /tmp/benchmark.py

      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berg-top20-benchmark
          path: out/
          retention-days: 7
